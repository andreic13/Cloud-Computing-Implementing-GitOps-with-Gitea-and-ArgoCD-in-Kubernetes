apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-courses-deployment
  labels:
    app: cloud-courses
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-courses
  template:
    metadata:
      labels:
        app: cloud-courses
    spec:
      containers:
      # Container 1: Host Cloud Courses pe 3000
      - name: cloud-courses
        image: cloud-courses:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: URL
          value: "http://localhost"
        - name: BASE_URL
          value: "/"

      # Containerul 2: Nginx Reverse Proxy pe 80
      - name: nginx-reverse-proxy
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10 # Timp inainte de primul Get
          periodSeconds: 5 # Cat de des se verifica


      volumes:
      - name: config-volume
        configMap:
          name: nginx-proxy-config
